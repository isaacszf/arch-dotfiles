# Styled to match Pond's sidebar cards (Theme.qml: #1D1D1D card, #303030 border, #F8F9F9 text, 16px radius).

[main]
font=Onest:size=12
use-bold=no
prompt="  "
placeholder=Search apps
icon-theme=Adwaita
icons-enabled=yes
image-size-ratio=0.5
width=36
lines=9
horizontal-pad=20
vertical-pad=16
inner-pad=12
line-height=30
letter-spacing=0
layer=overlay
anchor=center
exit-on-keyboard-focus-loss=yes
match-counter=yes

[colors]
background=1d1d1df2
text=f8f9f9b3
prompt=f8f9f966
placeholder=f8f9f94d
input=f8f9f9ff
match=ffffffff
selection=ffffff17
selection-text=f8f9f9ff
selection-match=ffffffff
counter=f8f9f94d
border=303030ff

[border]
width=1
radius=16
selection-radius=8
