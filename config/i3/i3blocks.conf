SCRIPT_DIR=/home/fernandes/.config/i3/scripts

[cpu_usage]
label=CPU 
interval=10
command=$SCRIPT_DIR/cpu_usage/cpu_usage
separator=true

[temperature]
label=
command=$SCRIPT_DIR/temperature/temperature
interval=3

[memory]
label=
separator=true
command=$SCRIPT_DIR/memory/memory
interval=25

[load_average]
label=LOAD
interval=10

[time]
command=date '+%Y-%m-%d %H:%M:%S'
interval=5
